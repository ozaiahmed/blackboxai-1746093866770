<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Method - Clothing Brand</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navigation -->
  <header class="bg-white shadow">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">Clothing Brand</a>
      <div class="space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-indigo-600 font-semibold transition">Home</a>
        <a href="payment.html" class="text-gray-700 hover:text-indigo-600 font-semibold transition">Payment Method</a>
      </div>
    </nav>
  </header>

  <!-- Payment Form Section -->
  <main class="container mx-auto px-6 py-16 max-w-lg">
    <h1 class="text-3xl font-bold mb-8 text-center">Payment Method</h1>
    <form action="#" method="POST" class="bg-white p-8 rounded-lg shadow-md" aria-label="Payment form">
      <div class="mb-4">
        <label for="cardName" class="block text-gray-700 font-semibold mb-2">Cardholder Name</label>
        <input type="text" id="cardName" name="cardName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="John Doe" />
      </div>
      <div class="mb-4">
        <label for="cardNumber" class="block text-gray-700 font-semibold mb-2">Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber" required maxlength="19" pattern="\d{13,19}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="1234 5678 9012 3456" />
      </div>
      <div class="flex space-x-4 mb-4">
        <div class="flex-1">
          <label for="expiry" class="block text-gray-700 font-semibold mb-2">Expiration Date</label>
          <input type="month" id="expiry" name="expiry" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-600" />
        </div>
        <div class="flex-1">
          <label for="cvv" class="block text-gray-700 font-semibold mb-2">CVV</label>
          <input type="password" id="cvv" name="cvv" required maxlength="4" pattern="\d{3,4}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="123" />
        </div>
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">Pay Now</button>
    </form>
  </main>

  <footer class="bg-white py-6 text-center text-gray-600 text-sm mt-16">
    &copy; 2024 Clothing Brand. All rights reserved.
  </footer>

</body>
</html>
